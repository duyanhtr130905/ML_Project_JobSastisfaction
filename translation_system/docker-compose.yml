version: '3.8'

services:
  # Translation API Service
  translation-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: translation-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CHROMA_PERSIST_DIR=/data/translation_memory
      - DEVICE=cpu
    volumes:
      - ./data:/data
      - ./translation_system:/app/translation_system
    networks:
      - translation-network
    restart: unless-stopped

  # PostgreSQL Database for Analytics
  postgres:
    image: postgres:14-alpine
    container_name: translation-db
    environment:
      - POSTGRES_DB=translation_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./analytics/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - translation-network
    restart: unless-stopped

  # Apache Superset for Analytics
  superset:
    image: apache/superset:latest
    container_name: translation-superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=your-secret-key-here
      - SUPERSET_LOAD_EXAMPLES=no
    volumes:
      - superset-data:/app/superset_home
    networks:
      - translation-network
    depends_on:
      - postgres
    restart: unless-stopped
    command: >
      sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
      "

  # Redis for Caching (Optional)
  redis:
    image: redis:7-alpine
    container_name: translation-redis
    ports:
      - "6379:6379"
    networks:
      - translation-network
    restart: unless-stopped

volumes:
  postgres-data:
  superset-data:

networks:
  translation-network:
    driver: bridge
